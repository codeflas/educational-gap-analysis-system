# Fixed test RSA keypair (real openssl output — see jwt/README.md) for every Spring Boot
# test context: with JwtConfiguration on the component-scan path, the ADR-013/A5 fail-fast
# policy would otherwise abort test startup (no dev profile, no keys). Deliberately a
# .properties file: a test-classpath application.yml would shadow the main application.yml
# entirely, whereas this file merges on top of it.
egas.security.jwt.private-key-location=classpath:jwt/test-private.pem
egas.security.jwt.public-key-location=classpath:jwt/test-public.pem

# Test principal roster. Deliberately NOT the 'dev-' roster from application-dev.yml: test
# contexts run without the dev profile, so a dev-prefixed principal would (correctly) abort
# startup. Using 'test-' names instead means the suite exercises the same path a deployment
# takes — an operator-supplied roster under a non-dev profile — and proves the guard does not
# fire on legitimate principals.
#   test-educator  / test-educator-password
#   test-learner   / test-learner-password
#   test-admin     / test-admin-password
#   test-learner-2 / test-learner-2-password
#
# A second LEARNER principal exists because learner-profile ownership can only be exercised with
# two distinct non-privileged subjects: one owner and one intruder. Using an EDUCATOR as the
# intruder would test the privileged-reader path instead, which is a different cell of the matrix.
egas.security.principals[0].username=test-educator
egas.security.principals[0].password-hash=$2a$10$88LzfKyzkTVeo6WX8.yqweh8LVg9c1wCUEatNJjZvmIjGYLUzPU/2
egas.security.principals[0].roles=EDUCATOR
egas.security.principals[1].username=test-learner
egas.security.principals[1].password-hash=$2a$10$fb0wp6gB5hphsIejS2UDr.u.itbUKXRwKzuvTpsb6TTsHmMI2xD/a
egas.security.principals[1].roles=LEARNER
egas.security.principals[2].username=test-admin
egas.security.principals[2].password-hash=$2a$10$szUnUQIVidw8bClPeZxinO2aYB4Nm3rS7ZYj8kN3wpwfZURWstoYa
egas.security.principals[2].roles=ADMIN
egas.security.principals[3].username=test-learner-2
egas.security.principals[3].password-hash=$2a$10$dCfu7LZzzqlH9JiFCzwPTOOGR3l8xFdBPtqtEQmAftoIsyf/5Awie
egas.security.principals[3].roles=LEARNER
