# Fixed test RSA keypair (real openssl output — see jwt/README.md) for every Spring Boot
# test context: with JwtConfiguration on the component-scan path, the ADR-013/A5 fail-fast
# policy would otherwise abort test startup (no dev profile, no keys). Deliberately a
# .properties file: a test-classpath application.yml would shadow the main application.yml
# entirely, whereas this file merges on top of it.
egas.security.jwt.private-key-location=classpath:jwt/test-private.pem
egas.security.jwt.public-key-location=classpath:jwt/test-public.pem
