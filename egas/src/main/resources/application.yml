spring:
  application:
    name: egas

  threads:
    virtual:
      enabled: true   # ADR-004: Loom over WebFlux — blocking style, non-blocking scalability

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/egas}
    username: ${DB_USERNAME:egas}
    password: ${DB_PASSWORD:egas}   # dev default only; real values injected via environment

  flyway:
    # Module migration locations are pre-wired; directories are added as each context lands.
    fail-on-missing-locations: false
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/competency
      - classpath:db/migration/learner
      - classpath:db/migration/catalogue
      - classpath:db/migration/gapanalysis
      - classpath:db/migration/recommendation

  jackson:
    default-property-inclusion: non_null

  jpa:
    open-in-view: false          # no lazy loading in the web layer; transactions end at the application service
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only verifies the mapping against it

  mvc:
    problemdetails:
      enabled: true              # RFC 9457 problem+json for framework-raised errors (400, 405, ...)

  docker:
    compose:
      lifecycle-management: start_only   # local dev convenience; keep DB running across restarts

egas:
  security:
    jwt:
      issuer: ${EGAS_SECURITY_JWT_ISSUER:egas}
      ttl: ${EGAS_SECURITY_JWT_TTL:PT1H}
      # Key locations are deliberately absent here — key material is environment-injected and
      # never committed (ADR-013, amendment A5):
      #   EGAS_SECURITY_JWT_PRIVATE_KEY_LOCATION=file:/run/secrets/jwt-private.pem   (PKCS#8)
      #   EGAS_SECURITY_JWT_PUBLIC_KEY_LOCATION=file:/run/secrets/jwt-public.pem     (X.509 SPKI)
      #
      # Absent + dev profile  -> an in-memory RSA-2048 pair is generated and loudly logged;
      #                          tokens do not survive a restart. `mvn spring-boot:run` activates
      #                          the dev profile (see spring-boot-maven-plugin in pom.xml).
      # Absent + any other    -> startup ABORTS rather than silently self-signing. This is the
      #                          intended behaviour of `java -jar` without configuration, not a
      #                          gap: a silently self-signing instance would mask precisely the
      #                          misconfiguration that matters most.
      # Exactly one of the two -> rejected in every profile; half-configuration is operator error.

    # NO PRINCIPALS ARE DEFINED HERE, DELIBERATELY. The development roster lives in
    # application-dev.yml, which Spring loads only under the dev profile, so a deployed instance
    # cannot inherit development credentials by forgetting to override them.
    #
    # A real deployment supplies its own roster through the environment, e.g.
    #   EGAS_SECURITY_PRINCIPALS_0_USERNAME / _PASSWORD_HASH / _ROLES
    # (Spring Boot replaces rather than merges collections across property sources, so an
    # environment-supplied roster fully displaces any file-based one.)
    #
    # Usernames beginning with 'dev-' are reserved for development principals and are REJECTED at
    # startup outside the dev profile (PrincipalConfiguration) — the credential-side counterpart
    # of the ADR-013/A5 key policy, so dev credentials fail loudly rather than silently.
    #
    # With no roster and no override, the token endpoint authenticates nobody: the instance fails
    # closed. That is a deliberate posture, not an oversight — a running instance with no way in
    # is safe, whereas one with well-known credentials is not.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    # Secure defaults: no leakage of internals via error responses. Structured, intentional
    # error bodies (RFC 9457 problem details) arrive with the first controllers in Step 3/4.
    include-message: never
    include-stacktrace: never
