# Local development infrastructure. Credentials are deliberately trivial and dev-only;
# deployed environments inject real secrets via environment variables (never committed).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: egas
      POSTGRES_USER: egas
      POSTGRES_PASSWORD: egas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egas -d egas"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
